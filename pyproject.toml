[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verity-runtime"
version = "0.1.0"
description = "Intent-aware execution runtime for autonomous agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["verity*"]